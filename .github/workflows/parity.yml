name: Parity Check
on: [push, pull_request]
jobs:
  check-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: enitandev/tracenews
          path: frontend
      - name: Compare JSON files
        run: |
          python3 -c "
          import json, sys
          try:
              with open("backend/app/readerAnalyticsConsent.json") as f1, open("frontend/src/components/MonitoringSpirit/readerAnalyticsConsent.json") as f2:
                  d1 = json.load(f1)
                  d2 = json.load(f2)
                  if d1 != d2:
                      print("Mismatch found!")
                      sys.exit(1)
                  print("Match successful.")
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
          "
